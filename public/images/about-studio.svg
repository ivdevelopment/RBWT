<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Hartfelt Studio team working in the studio">
  <rect width="640" height="480" fill="#f7f6f2"/>
  <rect x="0" y="0" width="640" height="480" fill="url(#grid)" opacity="0.5"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2dfd7" stroke-width="1"/>
    </pattern>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d9c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ca5e38" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- large window -->
  <rect x="40" y="40" width="400" height="300" rx="16" fill="#ffffff" stroke="#e2dfd7" stroke-width="1.5"/>
  <rect x="40" y="40" width="400" height="300" rx="16" fill="url(#sun)" opacity="0.35"/>
  <line x1="240" y1="40" x2="240" y2="340" stroke="#e2dfd7" stroke-width="1.5"/>
  <line x1="40" y1="190" x2="440" y2="190" stroke="#e2dfd7" stroke-width="1.5"/>
  <!-- skyline behind window -->
  <path d="M80 340 V 260 h 40 v 80 M160 340 V 220 h 60 v 120 M270 340 V 250 h 36 v 90 M350 340 V 230 h 48 v 110" fill="#eae7df"/>
  <!-- small plant -->
  <path d="M560 400 q -30 -80 -70 -90" fill="none" stroke="#4a6b4a" stroke-width="6" stroke-linecap="round"/>
  <circle cx="492" cy="306" r="14" fill="#5d8059"/>
  <circle cx="486" cy="300" r="10" fill="#6f946a" opacity="0.8"/>
  <!-- desk -->
  <rect x="56" y="336" width="368" height="10" rx="5" fill="#1c1916"/>
  <rect x="80" y="346" width="12" height="54" fill="#c9c4b9"/>
  <rect x="200" y="346" width="12" height="54" fill="#c9c4b9"/>
  <!-- laptop -->
  <rect x="120" y="288" width="240" height="48" rx="6" fill="#1c1916"/>
  <rect x="128" y="294" width="224" height="30" rx="4" fill="#3aa0a8"/>
  <path d="M330 336 l 50 12 h -310 l 50 -12 z" fill="#1c1916"/>
  <!-- coffee mug -->
  <rect x="470" y="306" width="36" height="34" rx="6" fill="#ffffff" stroke="#ca5e38" stroke-width="2"/>
  <path d="M506 312 h 10 a 8 8 0 0 1 0 16 h -10" fill="none" stroke="#ca5e38" stroke-width="2"/>
  <!-- sticky notes on wall -->
  <rect x="52" y="60" width="28" height="28" rx="2" fill="#f2d16b" opacity="0.9" transform="rotate(-6 66 74)"/>
  <rect x="88" y="56" width="28" height="28" rx="2" fill="#f2c4a3" opacity="0.9" transform="rotate(5 102 70)"/>
  <!-- people avatars (abstract) -->
  <circle cx="520" cy="120" r="26" fill="#1c1916"/>
  <circle cx="520" cy="120" r="9" fill="#f7f6f2"/>
  <circle cx="572" cy="160" r="22" fill="#ca5e38"/>
  <circle cx="572" cy="160" r="8" fill="#f7f6f2"/>
  <text x="52" y="440" font-family="Sora, sans-serif" font-size="20" font-weight="600" fill="#1c1916">The studio</text>
  <text x="52" y="464" font-family="Inter, sans-serif" font-size="13" fill="#6c6860">Mission District, San Francisco</text>
</svg>